name: Feature request
description: Suggest a new ClientCore feature or integration.
title: "[Feature]: "
labels: [ "enhancement", "needs-triage" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the gameplay, admin workflow, or integration gap this should solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Include commands, config shape, permissions, and expected Folia/Paper behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Client-side blocks
        - Client-side builds
        - Client-side mobs
        - Client-side drops
        - Client-side loot chests
        - NPC visibility
        - Luck system
        - Storage
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Example configuration
      render: yaml
