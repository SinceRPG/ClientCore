name: Bug report
description: Report a reproducible ClientCore problem.
title: "[Bug]: "
labels: [ "bug", "needs-triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for runtime errors, broken client-side visuals, Folia region-thread issues, or feature regressions.
  - type: input
    id: server
    attributes:
      label: Server platform and version
      description: "Example: Paper 1.21.8 build 42, Folia 1.21.8 build 12, or Spigot 1.21.x."
      placeholder: "Folia 1.21.8 build ..."
    validations:
      required: true
  - type: input
    id: clientcore
    attributes:
      label: ClientCore version or commit
      placeholder: "v1.0.0 or commit hash"
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Installed hooks/plugins
      description: Include PlaceholderAPI, WorldGuard, MythicMobs, ModelEngine, MMOItems, Citizens, FancyNpcs, and versions when relevant.
      placeholder: |
        PlaceholderAPI:
        WorldGuard:
        MythicMobs:
        ModelEngine:
        MMOItems:
        Citizens/FancyNpcs:
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste only the affected rule or setting. Redact credentials.
      render: yaml
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Include stack traces, console logs, and screenshots if useful.
      render: text
    validations:
      required: true
