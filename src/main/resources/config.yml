# ==============================================================================
# ClientCore Main Configuration
# Target server: Paper/Folia 26.1.2 only.
# ==============================================================================

settings:
  # Enable for verbose console logs during operations (helpful for debugging).
  debug: false

storage:
  # Player runtime data and cooldowns are stored in SQL.
  # Use 'sqlite' for a single server, or 'mysql' if you are sharing data across a network proxy.
  # Note: The required JDBC driver must be available on the server classpath.
  type: sqlite
  sqlite:
    file: clientcore.db
  mysql:
    host: localhost
    port: 3306
    database: clientcore
    username: root
    password: ""
  pool:
    maximum-size: 4
    minimum-idle: 1
    connection-timeout-ms: 10000

luck:
  # Luck increases the chance of rolling a "rare" variant for block drops, mob spawns, etc.
  # Formula: finalWeight = baseWeight * (1 + min(maxBonus, luck * luckMultiplier / 100)).
  max-rare-weight-bonus-percent: 300.0
  item:
    # Settings for a physical item representing Luck.
    # Administrators can give this item via: /clientcore luck giveitem <player> <luck> <amount>
    material: RABBIT_FOOT
    amount: 1
    name: "<gold>Luck Token"
    item-name: "<gold>Luck Token"
    lore:
      - "<gray>Right-click to consume and gain luck."
    rarity: RARE
    enchantment-glint: true
    hide-flags: [ HIDE_ATTRIBUTES, HIDE_ENCHANTS ]

hooks:
  # Toggle hooks to third-party plugins on or off.
  # Set these to false if the plugin is not installed to prevent errors.
  placeholderapi: true
  worldguard: true
  mmoitems: true
  mythicmobs: true
  citizens: true
  fancynpcs: true