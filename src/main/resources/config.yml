# ==============================================================================
# ClientCore Main Configuration
# Target server: Paper/Folia 26.1.2 only.
# This configuration file controls the core settings, database connectivity,
# luck mechanics, and third-party plugin hooks.
# ==============================================================================

settings:
  # Enable for verbose console logs during operations (helpful for debugging issues).
  debug: false

storage:
  # Player runtime data and cooldowns are stored in SQL.
  # Use 'sqlite' for a single server, or 'mysql' if you are sharing data across a network proxy.
  # Note: The required JDBC driver must be available on the server classpath.
  type: sqlite
  
  # Configuration for SQLite (Recommended for single server setups)
  sqlite:
    file: clientcore.db

  # Configuration for MySQL/MariaDB (Recommended for proxy networks/BungeeCord/Velocity setups)
  mysql:
    host: localhost
    port: 3306
    database: clientcore
    username: root
    password: "your_secure_password"

  # Connection pool settings for database performance tuning
  pool:
    maximum-size: 4
    minimum-idle: 1
    connection-timeout-ms: 10000

luck:
  # Luck increases the chance of rolling a "rare" variant for block drops, mob spawns, etc.
  # Formula: finalWeight = baseWeight * (1 + min(maxBonus, luck * luckMultiplier / 100)).
  max-rare-weight-bonus-percent: 300.0
  item:
    # Settings for a physical item representing Luck.
    # Administrators can give this item via command: /clientcore luck giveitem <player> <luck> <amount>
    material: RABBIT_FOOT
    amount: 1
    name: "<gold>Luck Token"
    item-name: "<gold>Luck Token"
    lore:
      - "<gray>Right-click to consume and gain luck."
      - "<dark_gray>Increases your chance of finding rare items."
    # Rarity controls the visual color of the item name in some client versions.
    rarity: RARE
    # Whether the item should have an enchanted glow effect.
    enchantment-glint: true
    # Hide default vanilla item tooltips.
    hide-flags: [ HIDE_ATTRIBUTES, HIDE_ENCHANTS ]

hooks:
  # Toggle hooks to third-party plugins on or off.
  # Set these to false if the plugin is not installed on your server to prevent Java class errors.
  # If a hook is enabled but the plugin is missing, a warning will be logged and the hook will be safely ignored.
  placeholderapi: true # Enables the use of %placeholders% in conditions and messages.
  worldguard: true     # Enables region-based checks for block regen and spawning.
  mmoitems: true       # Enables dropping custom items defined in MMOItems.
  mythicmobs: true     # Enables spawning custom mobs defined in MythicMobs.
  modelengine: true    # Enables hiding ModelEngine render entities for client-side mobs.
  citizens: true       # Enables using Citizens for client-side NPCs.
  fancynpcs: true      # Enables using FancyNpcs for client-side NPCs.
