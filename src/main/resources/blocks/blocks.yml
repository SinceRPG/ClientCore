# ==============================================================================
# Client-Side Block Regen Settings
# Modifies how clients see specific block locations based on rules and conditions.
# Fake block updates are sent with PacketEvents; the real server block should be AIR.
# All settings below provide examples of how you can configure block regeneration
# for different use cases and player conditions.
# ==============================================================================

vanilla-mining:
  enabled: false
  # Optional WorldGuard flag checked before ClientCore takes over mining.
  # Leave blank to allow configured vanilla mining anywhere.
  default-worldguard-flag: ""

  # Runtime enchant effects applied after a mining tool rule chooses the base time/drops.
  # These are formulas, so you do not need to create one tool rule for every Efficiency/Fortune level.
  enchant-effects:
    efficiency:
      enabled: true
      # Variables: base/time, level. Functions: random(min,max), min(a,b), max(a,b), floor(x), ceil(x), round(x).
      # Final time = base - (base * reduction-percent / 100).
      reduction-percent-formula: "level * random(1, level)"
      min-time-ticks: 1
    fortune:
      enabled: true
      # Variables: base/amount, level. The result is added to each configured drop stack.
      # Silk Touch disables Fortune for configured drops.
      bonus-amount-formula: "random(0, level)"
  blocks:
    # Custom mining controller for real vanilla blocks.
    # Bukkit cancels the normal break, PacketEvents sends the crack animation,
    # then ClientCore breaks the real block when the configured timer completes.
    # Tool drops override block-level drops. If the matching tool has no drops
    # and the block has no drops, ClientCore falls back to normal vanilla drops.
    STONE:
      enabled: true
      condition: ""
      conditions: [ ]
      mining:
        feedback:
          display: true
          actionbar: false
          particles: true
          sounds: true
          interval-ticks: 4
          message: "<gray>Mining <white>{progress}%</white>"
          display-format: "<bold>{bar}</bold> <white>{progress}%</white>"
          bar-length: 12
          low-color: "<gold>"
          mid-color: "<yellow>"
          high-color: "<green>"
          empty-color: "<dark_gray>"
          background-argb: "8C0C1016"
        default-time-ticks: 60
        tools:
          - item:
              type: vanilla
              material: WOODEN_PICKAXE
            time-ticks: 80
            drops:
              - type: vanilla
                material: COBBLESTONE
                amount: 1
                name: "<gray>Rough Cobblestone"
          - item:
              type: mmoitems
              mmo-type: TOOL
              mmo-id: STARTER_PICKAXE
            # Optional vanilla enchant requirements are supported on vanilla, MMOItems, and any tool rules.
            # Vanilla keys default to minecraft:.
            # enchants:
            #   efficiency: 2
            time-ticks: 40
            drops:
              - type: mmoitems
                mmo-type: MATERIAL
                mmo-id: STARTER_STONE
                material: COBBLESTONE
    DIAMOND_ORE:
      enabled: false
      mining:
        default-time-ticks: 120
        tools:
          - item:
              type: vanilla
              material: IRON_PICKAXE
            time-ticks: 140
            drops:
              - type: vanilla
                material: DIAMOND
                amount: 1
          - item:
              type: vanilla
              material: DIAMOND_PICKAXE
            time-ticks: 90
            drops:
              - type: vanilla
                material: DIAMOND
                amount: 2

block-regen:
  enabled: true
  # Determines the rendering radius around the player for fake blocks.
  # Higher values can impact client performance.
  refresh-radius: 10
  # How often (in ticks) to check and resend the blocks to the player. (20 ticks = 1 second)
  refresh-period-ticks: 40
  # The default WorldGuard flag name to check if breaking blocks is allowed here.
  default-worldguard-flag: clientcore-regen
  # Delay (in ticks) after player joins before sending the first block update.
  join-delay-ticks: 5

  rules:
    # Example 1: Basic block regeneration based on a single condition (MMOCore level).
    level-1-bedrock:
      enabled: true
      location:
        world: world
        x: 10
        y: 65
        z: 10
      # ORIGINAL means it will show the actual real block (AIR) before mining,
      # or you can specify a specific material like STONE.
      ready-block: STONE
      # The fake block sent to the client while the node is regenerating.
      cooldown-block: BEDROCK
      # Legacy single placeholder condition (Use 'conditions' list for multiple)
      condition: "%mmocore_level%;<=;1"
      conditions: [ ]
      # The amount of time in ticks it takes for the client-side block to visually "respawn".
      regen-ticks: 80
      # Optional custom mining controller. When present, ClientCore controls break time server-side.
      mining:
        # Hard hitbox block sent while mining.
        active-block: BARRIER
        # block-display keeps the old smooth BARRIER + BlockDisplay overlay behavior.
        # active-block uses the sent active-block itself as the visual, which is best when a
        # resource pack or supported custom block plugin maps that state to a stone/ore/custom-block texture.
        # Supported custom block prefixes: oraxen:<id>, itemsadder:<namespace:id>, nexo:<id>, craftengine:<namespace:id>.
        visual-mode: block-display
        feedback:
          display: true
          actionbar: false
          particles: true
          sounds: true
          interval-ticks: 4
          message: "<gray>Mining <white>{progress}%</white>"
          display-format: "<bold>{bar}</bold> <white>{progress}%</white>"
          bar-length: 12
          low-color: "<gold>"
          mid-color: "<yellow>"
          high-color: "<green>"
          empty-color: "<dark_gray>"
          background-argb: "8C0C1016"
        default-time-ticks: 60
        tools:
          - item:
              type: vanilla
              material: WOODEN_PICKAXE
            time-ticks: 80
            regen-ticks: 120
            drops:
              - type: vanilla
                material: COBBLESTONE
                amount: 1
          - item:
              type: mmoitems
              mmo-type: TOOL
              mmo-id: STARTER_PICKAXE
            time-ticks: 40
            regen-ticks: 60
            drops:
              - type: mmoitems
                mmo-type: MATERIAL
                mmo-id: STARTER_STONE
                material: STONE
      # Items that the player will physically receive into their inventory when mining.
      drops:
        - type: vanilla
          material: COBBLESTONE
          amount: 1

    # Example 2: Advanced block regeneration for VIP players with custom item drops.
    vip-diamond-ore:
      enabled: true
      location:
        world: world
        x: 15
        y: 60
        z: 20
      ready-block: DIAMOND_ORE
      cooldown-block: DEEPSLATE
      weight: 1.0
      rare: false
      luck-multiplier: 1.0
      required-condition-ids: [ ]
      # Multiple conditions using the 'conditions' list. All must be true.
      condition: ""
      conditions:
        - "%luckperms_has_permission_vip%;==;true"
        - "%player_health%;>=;10"
      regen-ticks: 1200 # 60 seconds cooldown
      drops:
        - type: vanilla
          material: DIAMOND
          amount: 2
          name: "<aqua>VIP Diamond"
          lore:
            - "<gray>A special diamond for VIPs."
      # Optional variants let one rule roll different visuals and rewards.
      variants:
        - id: common
          ready-block: DIAMOND_ORE
          cooldown-block: DEEPSLATE
          weight: 90.0
          rare: false
          luck-multiplier: 1.0
          required-condition-ids: [ ]
          regen-ticks: 1200
          drops:
            - type: vanilla
              material: DIAMOND
              amount: 1
        - id: rare
          ready-block: EMERALD_ORE
          cooldown-block: BEDROCK
          weight: 10.0
          rare: true
          luck-multiplier: 2.0
          required-condition-ids: [ ]
          regen-ticks: 1800
          drops:
            - type: vanilla
              material: EMERALD
              amount: 2

    # Example 3: Custom plugin block mining with visual-mode: active-block.
    # These disabled examples show the supported custom block ID prefixes.
    oraxen-active-block-ore:
      enabled: false
      location:
        world: world
        x: 30
        y: 65
        z: 30
      ready-block: oraxen:amethyst_ore
      cooldown-block: STONE
      regen-ticks: 300
      mining:
        # Sends Oraxen's backing block state directly so vanilla crack overlays render.
        active-block: oraxen:amethyst_ore
        visual-mode: active-block
        default-time-ticks: 80
        tools:
          - item:
              type: vanilla
              material: IRON_PICKAXE
            time-ticks: 80
            drops:
              - type: vanilla
                material: AMETHYST_SHARD
                amount: 2

    itemsadder-active-block-ore:
      enabled: false
      location:
        world: world
        x: 31
        y: 65
        z: 30
      ready-block: itemsadder:customcrops:ruby_ore
      cooldown-block: STONE
      regen-ticks: 300
      mining:
        # ItemsAdder IDs are normally namespace:id.
        active-block: itemsadder:customcrops:ruby_ore
        visual-mode: active-block
        default-time-ticks: 80
        tools:
          - item:
              type: vanilla
              material: IRON_PICKAXE
            drops:
              - type: vanilla
                material: REDSTONE
                amount: 3

    nexo-active-block-ore:
      enabled: false
      location:
        world: world
        x: 32
        y: 65
        z: 30
      ready-block: nexo:topaz_ore
      cooldown-block: STONE
      regen-ticks: 300
      mining:
        active-block: nexo:topaz_ore
        visual-mode: active-block
        default-time-ticks: 80
        tools:
          - item:
              type: vanilla
              material: IRON_PICKAXE
            drops:
              - type: vanilla
                material: GOLD_NUGGET
                amount: 4

    craftengine-active-block-ore:
      enabled: false
      location:
        world: world
        x: 33
        y: 65
        z: 30
      ready-block: craftengine:default:tin_ore
      cooldown-block: STONE
      regen-ticks: 300
      mining:
        # CraftEngine IDs are namespace:id; many packs use default:<id>.
        active-block: craftengine:default:tin_ore
        visual-mode: active-block
        default-time-ticks: 80
        tools:
          - item:
              type: vanilla
              material: IRON_PICKAXE
            drops:
              - type: vanilla
                material: RAW_IRON
                amount: 1

    # Example 7: Client-side farming node. Players right-click the fake crop to harvest it.
    wheat-farm:
      enabled: true
      location:
        world: world
        x: 20
        y: 65
        z: 20
      ready-block: WHEAT
      cooldown-block: FARMLAND
      regen-ticks: 200
      farming:
        enabled: true
        # Optional growth stages. While growing, players can harvest the current stage and receive that stage's drops.
        # Block data strings such as WHEAT[age=3] are supported.
        # Common max ages:
        # WHEAT/CARROTS/POTATOES: 7
        # BEETROOTS/NETHER_WART/SWEET_BERRY_BUSH: 3
        # COCOA: 2
        # TORCHFLOWER_CROP: 1
        # PITCHER_CROP: 4
        # CACTUS/SUGAR_CANE: 15
        # KELP/CAVE_VINES: 25
        stages:
          - block: WHEAT[age=0]
            after-ticks: 1
            drops:
              - type: vanilla
                material: WHEAT_SEEDS
                amount: 1
          - block: WHEAT[age=3]
            after-ticks: 80
            drops:
              - type: vanilla
                material: WHEAT_SEEDS
                amount: 2
          - block: WHEAT[age=7]
            after-ticks: 120
            drops:
              - type: vanilla
                material: WHEAT
                amount: 2
              - type: vanilla
                material: WHEAT_SEEDS
                amount: 1
        tools:
          - item:
              type: vanilla
              material: WOODEN_HOE
      drops:
        - type: vanilla
          material: WHEAT
          amount: 1

    # Example 4: Beetroot-style crop. BEETROOTS max age is 3.
    beetroot-farm:
      enabled: false
      location:
        world: world
        x: 21
        y: 65
        z: 20
      ready-block: BEETROOTS
      cooldown-block: FARMLAND
      regen-ticks: 200
      farming:
        enabled: true
        stages:
          - block: BEETROOTS[age=0]
            after-ticks: 1
            drops:
              - type: vanilla
                material: BEETROOT_SEEDS
                amount: 1
          - block: BEETROOTS[age=1]
            after-ticks: 80
            drops:
              - type: vanilla
                material: BEETROOT_SEEDS
                amount: 2
          - block: BEETROOTS[age=3]
            after-ticks: 120
            drops:
              - type: vanilla
                material: BEETROOT
                amount: 2
        tools:
          - item:
              type: vanilla
              material: WOODEN_HOE
      drops:
        - type: vanilla
          material: BEETROOT
          amount: 1

    # Example 5: Cocoa-style crop. COCOA max age is 2 and needs facing.
    cocoa-farm:
      enabled: false
      location:
        world: world
        x: 22
        y: 65
        z: 20
      ready-block: COCOA[age=2,facing=north]
      cooldown-block: COCOA[age=0,facing=north]
      regen-ticks: 200
      farming:
        enabled: true
        stages:
          - block: COCOA[age=0,facing=north]
            after-ticks: 1
            drops:
              - type: vanilla
                material: COCOA_BEANS
                amount: 1
          - block: COCOA[age=1,facing=north]
            after-ticks: 80
            drops:
              - type: vanilla
                material: COCOA_BEANS
                amount: 2
          - block: COCOA[age=2,facing=north]
            after-ticks: 120
            drops:
              - type: vanilla
                material: COCOA_BEANS
                amount: 3
      drops:
        - type: vanilla
          material: COCOA_BEANS
          amount: 1
